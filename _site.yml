name: "SN Lab Journal"
author: 
  - 'Susanna'
output_dir: "docs"
exclude: 
  - "data"
  - "_test"
bibliography: references.bib
navbar:
  left:
    - icon: fa-home
      href: index.html
    - text: "Weekly journal"
      menu:
      - text: "Week 1"
        href: Week1.html
      - text: "Week 2"
        href: Week2.html
    - text: "Final research paper"
      menu:
      - text: "Introduction"
        href: Introduction.html
        
        # here, other .Rmds can be added


  right:
  - icon: fab fa-github
    href: https://github.com/sus-lin/labjournalSNsusanna
output:
  html_document:
    theme: united
    highlight: default
    toc:  true
    toc_float: true
    number_sections: true
    code_folding: show
    code_download: yes
    css: tweaks.css
